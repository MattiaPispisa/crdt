name: greyhound_markdown_client
description: "Real-time collaborative markdown editor built on crdt_lf."
publish_to: 'none'
version: 0.10.0

environment:
  sdk: ^3.11.5

dependencies:
  crdt_lf: ^4.2.0
  crdt_lf_flutter: ^0.5.0
  crdt_socket_sync: ^0.7.0
  
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.3
  highlight: ^0.7.0
  markdown: ^7.3.1
  package_info_plus: ^8.0.0
  path_provider: ^2.1.5
  pdf: ^3.11.0
  url_launcher: ^6.3.0
  web: ^1.1.0
  web_socket_channel: ^3.0.0

  # state management
  bloc: ^9.0.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  hydrated_bloc: ^11.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/greyhound_markdown_logo.png
    - CHANGELOG.md
    # Embedded in exported PDFs. Loaded on demand by the exporter, so they
    # never weigh on the initial web payload. The built-in PDF fonts only
    # cover WinAnsi and would drop accented characters.
    - fonts/Roboto-Regular.ttf
    - fonts/Roboto-Bold.ttf
    - fonts/Roboto-Italic.ttf
    - fonts/Roboto-BoldItalic.ttf
