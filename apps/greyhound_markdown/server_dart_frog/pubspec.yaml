name: greyhound_markdown_server_dart_frog
description: >-
  Local Dart Frog relay server for the Greyhound Markdown client, on
  crdt_socket_sync_dart_frog.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  crdt_socket_sync: ">=0.10.0 <1.0.0"
  crdt_socket_sync_dart_frog: ">=0.1.0 <1.0.0"
  dart_frog: ^1.2.6

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
