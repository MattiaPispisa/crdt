# A recipe: what the docs site shows for it. Paths are relative to the
# repository root, so a recipe can show any tested file of the repository.
id: flutter-note
title: A text note in Flutter, saved on the device
description: >-
  A Flutter app with one collaborative text field. Hive keeps the note on the
  device, also on the web, and every restart shows it again.
platforms: [Flutter native, Flutter web]
# Shown as the install command: names only, `pub add` picks the versions.
dependencies: [crdt_lf, crdt_lf_flutter, crdt_lf_hive, hive, path_provider]
files:
  - path: packages/_internal/crdt_lf_recipes/lib/flutter_note/main.dart
    label: main.dart
  - path: packages/_internal/crdt_lf_recipes/lib/flutter_note/note_page.dart
    label: note_page.dart
test: packages/_internal/crdt_lf_recipes/test/flutter_note_test.dart
keyPoints:
  - "Set up the database of the adapter before you open the backend, as the documentation of the package it builds on explains."
  - "Open one backend for the whole app, and pass it to the pages."
  - "Create the handler on the document that `openDocument` returns, under the id the widgets read."
  - "`compactAfter` keeps the stored log short. A compaction drops the undo history of a `CRDTUndoManager`: leave it out where that matters, and call `persistence.compact()` at a moment you choose."
  - "`CrdtProvider.value` never disposes the document: the page closes it in `dispose`."
related:
  - title: Text fields
    to: /docs/connectors/flutter/text-fields
  - title: Persistence adapters
    to: /docs/connectors/persistence/adapters
  - title: Collaborative text
    to: /docs/use-cases/collaborative-text
