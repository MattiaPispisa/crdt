# A recipe: what the docs site shows for it. Paths are relative to the
# repository root, so a recipe can show any tested file of the repository.
id: drift-note
title: A text note saved with Drift
description: >-
  A Dart program that keeps one collaborative text in a Drift database. Every
  run reads the note back and adds a line.
platforms: [Dart VM, Flutter native]
# Shown as the install command: names only, `pub add` picks the versions.
dependencies: [crdt_lf, crdt_lf_drift]
files:
  - path: packages/_internal/crdt_lf_recipes/lib/drift_note/main.dart
    label: main.dart
test: packages/_internal/crdt_lf_recipes/test/drift_note_test.dart
keyPoints:
  - "`openDocument` reads the stored note before it returns, and keeps the same author (peer id) on every run."
  - "Close in this order: the persistence (it writes what is still waiting), the document, the storage, the backend. `backend.close()` returns a `Future`: await it."
  - "`CRDTDrift.open` uses a native database file. On the web, build the database with a web executor and pass it to `CRDTDrift.fromDatabase`: see the Drift documentation."
related:
  - title: Persistence
    to: /docs/connectors/persistence
  - title: Persistence adapters
    to: /docs/connectors/persistence/adapters
  - title: Collaborative text
    to: /docs/use-cases/collaborative-text
