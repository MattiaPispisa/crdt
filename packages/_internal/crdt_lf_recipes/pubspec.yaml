name: crdt_lf_recipes
description: >-
  Private, unpublished package holding the setup recipes of the docs site and
  of the README quick starts. Each recipe is compiled and tested here.
publish_to: "none"

version: 1.0.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.44.0"

dependencies:
  crdt_lf: ">=5.4.0 <6.0.0"
  crdt_lf_flutter: ^0.8.0
  crdt_lf_drift: ^0.3.2
  crdt_lf_hive: ^0.5.2
  crdt_lf_quill: ^0.1.0
  crdt_lf_sqlite: ^0.3.3
  crdt_socket_sync: ^0.10.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.6.0
  hive: ^2.2.3
  hlc_dart: ^1.2.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  ws_lint:
    path: ../ws_lint

flutter:
  uses-material-design: true
