name: factory_example
description: >-
  Private, unpublished package: the whole example app, built from a sync and a
  storage. The Flutter example apps of the packages run it.
publish_to: "none"

version: 1.0.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.44.0"

dependencies:
  crdt_lf:
    path: ../../core/crdt_lf
  crdt_lf_flutter:
    path: ../../core/crdt_lf_flutter
  crdt_lf_persistence:
    path: ../../core/crdt_lf_persistence
  crdt_socket_sync:
    path: ../../core/crdt_socket_sync
  flutter:
    sdk: flutter
  provider: ^6.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  persistence_conformance:
    path: ../persistence_conformance
  test:
  ws_lint:
    path: ../ws_lint

flutter:
  uses-material-design: true
