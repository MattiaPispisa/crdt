name: shared_examples_infrastructure
description: >-
  Private, unpublished package holding the shared UI and example logic reused by
  packages Flutter example apps.
publish_to: "none"

version: 1.0.0

environment:
  sdk: ^3.7.0
  flutter: ">=3.44.0"

dependencies:
  crdt_lf:
    path: ../../core/crdt_lf
  crdt_lf_flutter:
    path: ../../core/crdt_lf_flutter
  flutter:
    sdk: flutter
  provider: ^6.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test:
  ws_lint:
    path: ../ws_lint

flutter:
  uses-material-design: true
