name: crdt_socket_sync_serverpod_example
description: >-
  Example Serverpod backend serving the crdt_socket_sync server–client mode on
  /sync, with the documents kept in Hive.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  crdt_lf_hive: ">=0.5.0 <1.0.0"
  crdt_socket_sync: ">=0.10.0 <1.0.0"
  crdt_socket_sync_serverpod: ">=0.1.0 <1.0.0"
  hive: ^2.0.0
  serverpod: ^4.0.3

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
