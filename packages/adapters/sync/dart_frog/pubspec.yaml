name: crdt_socket_sync_dart_frog
description: Dart Frog adapter for crdt_socket_sync - serve CRDT sync and relay WebSocket sessions from a Dart Frog backend.
homepage: https://mattiapispisa.github.io/
repository: https://github.com/MattiaPispisa/crdt/tree/main/packages/adapters/sync/dart_frog
topics: [crdt, sync, websocket, dart-frog, server]

version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  crdt_socket_sync: ^0.10.0
  dart_frog: ^1.2.6
  dart_frog_web_socket: ^1.0.3

dev_dependencies:
  crdt_lf: ^5.0.0
  test: ^1.24.0
  web_socket_channel: ^3.0.0
