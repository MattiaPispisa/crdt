name: crdt_socket_sync_dart_frog_example
description: >-
  Example Dart Frog backend serving both crdt_socket_sync modes: a relay room
  on /relay and a CRDT-aware document on /sync.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  crdt_socket_sync: ">=0.10.0 <1.0.0"
  crdt_socket_sync_dart_frog: ">=0.1.0 <1.0.0"
  dart_frog: ^1.2.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
