name: crdt_lf_sqlite
description: sqlite3 storage adapter for CRDT LF library objects, providing persistence for Change and Snapshot objects.
homepage: https://mattiapispisa.github.io/
repository: https://github.com/MattiaPispisa/crdt/tree/main/packages/adapters/persistence/crdt_lf_sqlite
topics: [crdt, local-first, sqlite, persistence, dart]

version: 0.3.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  crdt_lf: ^4.2.0
  crdt_lf_persistence: ^0.1.0
  hlc_dart: ^1.0.0
  sqlite3: ^3.0.0

dev_dependencies:
  persistence_conformance:
    path: ../../../_internal/persistence_conformance
  test: ^1.24.0
