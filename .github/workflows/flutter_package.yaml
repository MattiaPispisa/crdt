name: Flutter Package CI

on:
  workflow_call:
    inputs:
      # The pub name: the melos scripts run on this package only.
      package_name:
        required: true
        type: string
      working_directory:
        required: true
        type: string
      min_coverage:
        required: false
        type: number
        default: 100
      coverage_exclude:
        required: false
        type: string
        default: ""

    secrets:
      CODECOV_TOKEN:
        required: true

# melos.yaml points at `.fvm/flutter_sdk`, which only fvm creates: use the
# Flutter SDK on the PATH, the version `.fvmrc` names.
env:
  MELOS_SDK_PATH: auto

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MELOS_PACKAGES: ${{inputs.package_name}}

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7

      - name: 🐦 Setup Flutter
        uses: kuhnroyal/flutter-fvm-config-action@v3
        with:
          setup: true
          cache: true

      - name: 📦 Setup melos and install dependencies
        uses: bluefireteam/melos-action@v3

      - name: ✨ Check Formatting
        run: melos run format

      - name: 🕵️ Analyze
        run: melos run analyze

      - name: 🧪 Run Tests
        run: melos run test_flutter --no-select -- --coverage

      - name: 📊 Check Code Coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: ${{inputs.working_directory}}/coverage/lcov.info
          min_coverage: ${{inputs.min_coverage}}
          exclude: ${{inputs.coverage_exclude}}

      - name: 📤 Upload coverage to Codecov
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: codecov/codecov-action@v7
        with:
          directory: ${{inputs.working_directory}}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          flags: ${{ inputs.package_name }}
          name: ${{ inputs.package_name }}-coverage
          verbose: false
          fail_ci_if_error: true
