name: Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      global: ${{ steps.filter.outputs.global }}
      hlc: ${{ steps.filter.outputs.hlc }}
      crdt_lf: ${{ steps.filter.outputs.crdt_lf }}
      crdt_lf_hive: ${{ steps.filter.outputs.crdt_lf_hive }}
      crdt_lf_sqlite: ${{ steps.filter.outputs.crdt_lf_sqlite }}
      crdt_lf_drift: ${{ steps.filter.outputs.crdt_lf_drift }}
      crdt_lf_persistence: ${{ steps.filter.outputs.crdt_lf_persistence }}
      persistence_conformance: ${{ steps.filter.outputs.persistence_conformance }}
      crdt_socket_sync: ${{ steps.filter.outputs.crdt_socket_sync }}
      editor_conformance: ${{ steps.filter.outputs.editor_conformance }}
      crdt_lf_flutter: ${{ steps.filter.outputs.crdt_lf_flutter }}
      crdt_lf_quill: ${{ steps.filter.outputs.crdt_lf_quill }}
      crdt_socket_sync_dart_frog: ${{ steps.filter.outputs.crdt_socket_sync_dart_frog }}
      crdt_socket_sync_serverpod: ${{ steps.filter.outputs.crdt_socket_sync_serverpod }}
      crdt_lf_recipes: ${{ steps.filter.outputs.crdt_lf_recipes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            global:
              - '.github/workflows/**'
              - 'analysis_options.yaml'
              - 'packages/_internal/ws_lint/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'melos.yaml'
              - 'scripts/**'
              - 'packages/_internal/shared_examples_infrastructure/**'
            hlc:
              - 'packages/core/hlc/**'
            crdt_lf:
              - 'packages/core/crdt_lf/**'
            crdt_lf_persistence:
              - 'packages/core/crdt_lf_persistence/**'
            persistence_conformance:
              - 'packages/_internal/persistence_conformance/**'
            crdt_lf_hive:
              - 'packages/adapters/persistence/crdt_lf_hive/**'
            crdt_lf_sqlite:
              - 'packages/adapters/persistence/crdt_lf_sqlite/**'
            crdt_lf_drift:
              - 'packages/adapters/persistence/crdt_lf_drift/**'
            crdt_socket_sync:
              - 'packages/core/crdt_socket_sync/**'
            editor_conformance:
              - 'packages/_internal/editor_conformance/**'
            crdt_lf_flutter:
              - 'packages/core/crdt_lf_flutter/**'
            crdt_lf_quill:
              - 'packages/adapters/text/crdt_lf_quill/**'
            crdt_socket_sync_dart_frog:
              - 'packages/adapters/sync/dart_frog/**'
            crdt_socket_sync_serverpod:
              - 'packages/adapters/sync/serverpod/**'
            crdt_lf_recipes:
              - 'packages/_internal/crdt_lf_recipes/**'

  hlc:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/core/hlc
      min_coverage: 90
      package_name: hlc_dart
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_lf:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/core/crdt_lf
      min_coverage: 90
      package_name: crdt_lf
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_lf_persistence:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.persistence_conformance == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/core/crdt_lf_persistence
      min_coverage: 90
      package_name: crdt_lf_persistence
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  persistence_conformance:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.persistence_conformance == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/_internal/persistence_conformance
      min_coverage: 100
      package_name: persistence_conformance
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_lf_hive:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.persistence_conformance == 'true'
       || needs.changes.outputs.crdt_lf_hive == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/adapters/persistence/crdt_lf_hive
      min_coverage: 90
      package_name: crdt_lf_hive
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_lf_sqlite:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.persistence_conformance == 'true'
       || needs.changes.outputs.crdt_lf_sqlite == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/adapters/persistence/crdt_lf_sqlite
      min_coverage: 90
      package_name: crdt_lf_sqlite
      install_sqlite: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_lf_drift:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.persistence_conformance == 'true'
       || needs.changes.outputs.crdt_lf_drift == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/adapters/persistence/crdt_lf_drift
      min_coverage: 90
      package_name: crdt_lf_drift
      install_sqlite: true
      coverage_exclude: "**/*.g.dart"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_socket_sync:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_socket_sync == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/core/crdt_socket_sync
      min_coverage: 70
      package_name: crdt_socket_sync
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_socket_sync_dart_frog:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.crdt_socket_sync == 'true'
       || needs.changes.outputs.crdt_socket_sync_dart_frog == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/adapters/sync/dart_frog
      min_coverage: 90
      package_name: crdt_socket_sync_dart_frog
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_socket_sync_serverpod:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.crdt_socket_sync == 'true'
       || needs.changes.outputs.crdt_socket_sync_serverpod == 'true' }}
    uses: ./.github/workflows/dart_package.yaml
    with:
      working_directory: ./packages/adapters/sync/serverpod
      min_coverage: 90
      package_name: crdt_socket_sync_serverpod
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The example apps are their own packages: `dart_package.yaml` skips them
  # (`--no-example`). Their tests start the real server the way the app does.
  crdt_socket_sync_dart_frog_examples:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.crdt_lf_hive == 'true'
       || needs.changes.outputs.crdt_socket_sync == 'true'
       || needs.changes.outputs.crdt_socket_sync_dart_frog == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - working_directory: packages/adapters/sync/dart_frog/example
            dart_dirs: lib routes test main.dart
          - working_directory: packages/adapters/sync/dart_frog/relay_example
            dart_dirs: lib routes test main.dart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: 📦 Install Dependencies
        run: dart pub get
      - name: ✨ Check Formatting
        run: dart format --line-length 80 --set-exit-if-changed ${{ matrix.dart_dirs }}
      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings
      - name: 🧪 Run Tests
        run: dart test

  crdt_socket_sync_serverpod_examples:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.crdt_lf_hive == 'true'
       || needs.changes.outputs.crdt_socket_sync == 'true'
       || needs.changes.outputs.crdt_socket_sync_serverpod == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - working_directory: packages/adapters/sync/serverpod/example
            dart_dirs: bin lib test
          - working_directory: packages/adapters/sync/serverpod/relay_example
            dart_dirs: bin lib test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.working_directory }}
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: 📦 Install Dependencies
        run: dart pub get
      - name: ✨ Check Formatting
        run: dart format --line-length 80 --set-exit-if-changed ${{ matrix.dart_dirs }}
      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos --fatal-warnings
      - name: 🧪 Run Tests
        run: dart test

  crdt_lf_flutter:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.editor_conformance == 'true'
       || needs.changes.outputs.crdt_lf_flutter == 'true' }}
    uses: ./.github/workflows/flutter_package.yaml
    with:
      working_directory: ./packages/core/crdt_lf_flutter
      min_coverage: 80
      package_name: crdt_lf_flutter
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_lf_quill:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_flutter == 'true'
       || needs.changes.outputs.editor_conformance == 'true'
       || needs.changes.outputs.crdt_lf_quill == 'true' }}
    uses: ./.github/workflows/flutter_package.yaml
    with:
      working_directory: ./packages/adapters/text/crdt_lf_quill
      min_coverage: 90
      package_name: crdt_lf_quill
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  crdt_lf_recipes:
    needs: changes
    if: >-
      ${{ needs.changes.outputs.global == 'true'
       || needs.changes.outputs.hlc == 'true'
       || needs.changes.outputs.crdt_lf == 'true'
       || needs.changes.outputs.crdt_lf_persistence == 'true'
       || needs.changes.outputs.crdt_lf_hive == 'true'
       || needs.changes.outputs.crdt_lf_sqlite == 'true'
       || needs.changes.outputs.crdt_socket_sync == 'true'
       || needs.changes.outputs.crdt_lf_flutter == 'true'
       || needs.changes.outputs.crdt_lf_quill == 'true'
       || needs.changes.outputs.crdt_lf_recipes == 'true' }}
    uses: ./.github/workflows/flutter_package.yaml
    with:
      working_directory: ./packages/_internal/crdt_lf_recipes
      # The recipes are examples: their tests prove they run, not coverage.
      min_coverage: 0
      package_name: crdt_lf_recipes
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The README quick starts are written from the recipe regions.
  recipes_check:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: 📦 Install Dependencies
        run: dart pub get
      - name: 🍳 Check the README quick starts
        run: dart run scripts/recipes_sync.dart --check

  license_check:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v7
      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
      - name: 📦 Install add_license dependencies
        working-directory: packages/_internal/add_license
        run: dart pub get
      - name: 🪪 Check license headers
        run: |
          status=0
          for dir in $(find packages apps -name pubspec.yaml -not -path '*/.dart_tool/*' | xargs -n1 dirname | sort); do
            dart run packages/_internal/add_license/bin/add_license.dart --check --root "$dir" || status=1
          done
          exit $status

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - changes
      - license_check
      - recipes_check
      - hlc
      - crdt_lf
      - crdt_lf_persistence
      - persistence_conformance
      - crdt_lf_hive
      - crdt_lf_sqlite
      - crdt_lf_drift
      - crdt_socket_sync
      - crdt_socket_sync_dart_frog
      - crdt_socket_sync_serverpod
      - crdt_socket_sync_dart_frog_examples
      - crdt_socket_sync_serverpod_examples
      - crdt_lf_flutter
      - crdt_lf_quill
      - crdt_lf_recipes
    steps:
      - name: Verify no job failed
        run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "A required job did not succeed: $r"
              exit 1
            fi
          done
          echo "All impacted jobs passed (skipped are OK)."
